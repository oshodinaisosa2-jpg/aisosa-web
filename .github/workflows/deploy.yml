name: Deploy to AWS S3

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Upload site to S3
        run: aws s3 sync . s3://aisosa-portfolio-demo --exclude ".git/*" --exclude ".github/*" --exclude "README.md"
      - name: Refresh CloudFront
        run: aws cloudfront create-invalidation --distribution-id EPM4H14AWBN8W --paths "/*"
